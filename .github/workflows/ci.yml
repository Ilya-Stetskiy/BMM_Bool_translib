name: CI

# "Лёгкий" CI — см. README.md §4 и core/CONVENTIONS.md п.8 за историей, почему
# его не было раньше (нужен был Docker-образ genetica-boolean-lib, нигде не
# опубликованный, чтобы GitHub Actions мог его стянуть). Этот workflow
# заходит с другой стороны: собирает те же зависимости из исходников прямо на
# GitHub-hosted раннере (scripts/install-deps.sh, версии продублированы из
# .devcontainer/Dockerfile) и кэширует результат — публикация образа в реестр
# больше не блокер.
#
# Что НЕ входит и почему:
#   - CUDA/GPU-раннер не нужен: в проекте нет .cu/__global__/device-кода,
#     cuda-gdb в README упомянут только как отладчик, а не зависимость сборки
#     (проверено отдельно перед тем как заводить этот workflow).
#   - Conda/Sage/PyTorch/code-server из Dockerfile сюда не идут — это
#     инструменты интерактивного workspace (Python-биндинг BRiAl через Sage,
#     GNN-эксперименты, VS Code в браузере), bmm-translib (чистый C++) их не
#     компилирует и не тестирует.
#   - TBB/OpenMP scaling-бенчмарки (секции "*_tbb_scaling"/"*_openmp_scaling"
#     в test_aig/test_anf/test_thr) исключены через `ctest -E` — это 91%
#     времени полного прогона (632 из 697 с, см. TEST_TIMING_REPORT.md) и по
#     своей природе не про корректность (PASS означает "измерено", не
#     "ускорение подтверждено", см. core/CONVENTIONS.md). Все остальные
#     таргеты — test_chains/test_full_matrix/test_large_n/test_real_datasets —
#     остаются и вместе с функциональными секциями укладываются в ~1-2 минуты.
#   - EPFL-датасет (`benchmarks/scripts/download_epfl.sh`) СКАЧИВАЕТСЯ (git
#     clone --depth 1, дёшево) — вопреки первоначальному плану, чтобы
#     реально проверить EPFL-случаи `test_real_datasets`, а не полагаться на
#     SKIP. Живой прогон (2026-08-11) сначала нашёл, что этот SKIP не
#     работал (`rep.bullet(false, ...)` вместо `rep.line("- SKIP ...")` в
#     `verify/real_datasets_tests.cpp` — расхождение с собственным
#     комментарием в CMakeLists.txt) — исправлено в коде теста (см.
#     CHANGELOG.md `[Unreleased]`), но датасет всё равно качаем здесь: без
#     него EPFL-случаи не проверяются вовсе, только пропускаются.
#   - Остальные датасеты (`benchmarks/data/{dimacs-cnf,satlib,iis-nsk,...}`)
#     и `benchmarks/large_scale_bench` — по-прежнему вне CI: `test_chains`/
#     `test_full_matrix`/`test_large_n` их не требуют, а `large_scale_bench`
#     не зарегистрирован в `ctest`.
#
# Кэш зависимостей — РАЗДЕЛЁН на restore/save (actions/cache/restore +
# actions/cache/save), не единый `actions/cache@v4`. Причина, найденная
# живым прогоном (2026-08-11): связанный `actions/cache@v4` сохраняет кэш
# только если ВЕСЬ job завершился успешно — когда `ctest` падал (см. ниже
# про EPFL), уже собранные за ~30-40 минут зависимости (CUDD/Sylvan/
# mockturtle/m4ri/BRiAl/kissat/CaDiCaL/OR-Tools) НЕ сохранялись, и следующий
# прогон снова пересобирал всё с нуля — дорого именно во время отладки
# самого CI. `actions/cache/save` с `if: always()` в конце job'а чинит это:
# кэш сохраняется независимо от исхода `ctest`.
#
# Второй job (asan-ubsan) — та же сборка, но с CMakeLists.txt/BMM_SANITIZE
# (`-fsanitize=address,undefined`), Debug вместо RelWithDebInfo. Отдельный,
# независимый от build-and-test job — переиспользует тот же кэш зависимостей
# (ключ идентичен, деп-либы сами не инструментированы санитайзерами).
# Подтверждён зелёным прогоном (2026-08-11) — см. комментарий у job'а.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: {}

env:
  BMM_DEPS_PREFIX: /opt/bmm-deps
  # ВАЖНО: ключи кэша НЕ вынесены в этот env-блок как готовые строки —
  # hashFiles() в workflow-level env вычисляется ДО checkout любого job'а
  # (файла scripts/install-deps.sh ещё не существует на диске раннера в этот
  # момент), поэтому вернул бы пустую строку и молча сломал инвалидацию
  # кэша. Каждый `key:` ниже поэтому пишет hashFiles(...) inline, внутри
  # шага job'а (после checkout) — единственное место, где эта функция
  # реально видит содержимое файла.

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    # Первый прогон (cache miss) может занять больше часа — доминирует сборка
    # Google OR-Tools с -DBUILD_DEPS=ON (протобуф/abseil из исходников, см.
    # scripts/install-deps.sh). После первого успешного прогона кэш переиспользуется
    # (ключ — хэш самого install-deps.sh, меняется только при правке версий),
    # и шаг ниже полностью пропускается.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить системные пакеты (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ cmake ninja-build \
            autoconf automake libtool m4 pkg-config \
            libboost-all-dev libgmp-dev libm4ri-dev libm4rie-dev \
            zlib1g-dev libssl-dev libtbb-dev unzip

      - name: Restore кэш собранных зависимостей (CUDD/Sylvan/mockturtle/m4ri/BRiAl/kissat/CaDiCaL/OR-Tools)
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BMM_DEPS_PREFIX }}
          # Ключ — хэш самого install-deps.sh: версии/теги/коммиты зашиты
          # прямо в него (см. комментарий в файле), поэтому любая правка
          # версии зависимости автоматически инвалидирует кэш.
          key: bmm-deps-${{ runner.os }}-${{ hashFiles('scripts/install-deps.sh') }}

      - name: Собрать зависимости из исходников (только при cache miss)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/install-deps.sh
          ./scripts/install-deps.sh

      - name: Прокинуть пути к зависимостям в окружение
        run: |
          echo "${BMM_DEPS_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${BMM_DEPS_PREFIX}/lib:${BMM_DEPS_PREFIX}/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=${BMM_DEPS_PREFIX}" >> "$GITHUB_ENV"

      - name: Проверить, что cadical/kissat/BRiAl/Sylvan видны
        run: |
          cadical --version
          kissat --version
          test -f "${BMM_DEPS_PREFIX}/include/polybori.h"
          test -f "${BMM_DEPS_PREFIX}/include/sylvan_obj.hpp"

      - name: Кэш FetchContent (Catch2/Tracy/oneTBB-fallback)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: bmm-fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Restore кэш EPFL-датасета (test_real_datasets)
        id: cache-epfl
        uses: actions/cache/restore@v4
        with:
          path: benchmarks/data/epfl
          key: bmm-epfl-dataset-v1

      - name: Скачать EPFL-датасет (только при cache miss)
        if: steps.cache-epfl.outputs.cache-hit != 'true'
        run: bash benchmarks/scripts/download_epfl.sh

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="${BMM_DEPS_PREFIX}" \
            -DMOCKTURTLE_ROOT="${BMM_DEPS_PREFIX}/mockturtle"

      - name: Build
        run: cmake --build build --parallel

      - name: ctest (без TBB/OpenMP scaling-бенчмарков — см. шапку файла)
        run: |
          ctest --test-dir build --output-on-failure \
            -E '(_tbb_scaling|_openmp_scaling)$'

      - name: STATUS.md (cmake --build --target status)
        run: cmake --build build --target status

      - name: Опубликовать STATUS.md как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STATUS.md
          path: STATUS.md

      # Save — ПОСЛЕДними, if: always(), после ctest/build. См. комментарий в
      # шапке файла: единый actions/cache@v4 сохранял бы кэш только при
      # успехе всего job'а, теряя уже собранные (за ~30-40 минут) зависимости
      # при каждом падении ctest.
      - name: Save кэш зависимостей (если был cache miss)
        if: always() && steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BMM_DEPS_PREFIX }}
          key: bmm-deps-${{ runner.os }}-${{ hashFiles('scripts/install-deps.sh') }}

      - name: Save кэш EPFL-датасета (если был cache miss)
        if: always() && steps.cache-epfl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: benchmarks/data/epfl
          key: bmm-epfl-dataset-v1

  # ---------------------------------------------------------------------------
  # asan-ubsan — продолжение методологии, уже подтвердившей себя на
  # ThreadSanitizer (см. core/CONVENTIONS.md, aig/README.md §1.3 — так нашли
  # реальную гонку в BRiAl). Независимый job, не `needs: build-and-test` —
  # тот же кэш зависимостей (ключ идентичен, deps не пересобираются с
  # санитайзерами, см. CMakeLists.txt/BMM_SANITIZE), но раздельная сборка
  # bmm-translib (Debug, не RelWithDebInfo — точнее стектрейсы).
  #
  # `continue-on-error` был здесь временно, до первого живого прогона —
  # опасались ложных срабатываний на границе с неинструментированными
  # Sylvan/BRiAl/OR-Tools (нестандартные аллокаторы, глобальное состояние
  # protobuf и т.п.). ПОДТВЕРЖДЕНО зелёным прогоном (2026-08-11, run
  # 31470510014, после починки EPFL/cache-split багов из build-and-test) —
  # ни одного срабатывания ASan/UBSan, job прошёл сам по себе, не благодаря
  # continue-on-error. Флаг снят.
  # ---------------------------------------------------------------------------
  asan-ubsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить системные пакеты (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ cmake ninja-build \
            autoconf automake libtool m4 pkg-config \
            libboost-all-dev libgmp-dev libm4ri-dev libm4rie-dev \
            zlib1g-dev libssl-dev libtbb-dev unzip

      - name: Restore кэш собранных зависимостей (общий с build-and-test — тот же ключ)
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BMM_DEPS_PREFIX }}
          key: bmm-deps-${{ runner.os }}-${{ hashFiles('scripts/install-deps.sh') }}

      - name: Собрать зависимости из исходников (только при cache miss)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/install-deps.sh
          ./scripts/install-deps.sh

      - name: Прокинуть пути к зависимостям в окружение
        run: |
          echo "${BMM_DEPS_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${BMM_DEPS_PREFIX}/lib:${BMM_DEPS_PREFIX}/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=${BMM_DEPS_PREFIX}" >> "$GITHUB_ENV"

      - name: Restore кэш EPFL-датасета (test_real_datasets)
        id: cache-epfl
        uses: actions/cache/restore@v4
        with:
          path: benchmarks/data/epfl
          key: bmm-epfl-dataset-v1

      - name: Скачать EPFL-датасет (только при cache miss)
        if: steps.cache-epfl.outputs.cache-hit != 'true'
        run: bash benchmarks/scripts/download_epfl.sh

      - name: Configure (Debug + ASan/UBSan)
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBMM_SANITIZE=address,undefined \
            -DCMAKE_PREFIX_PATH="${BMM_DEPS_PREFIX}" \
            -DMOCKTURTLE_ROOT="${BMM_DEPS_PREFIX}/mockturtle"

      - name: Build
        run: cmake --build build-asan --parallel

      - name: ctest (без TBB/OpenMP scaling-бенчмарков — не про корректность)
        run: |
          ctest --test-dir build-asan --output-on-failure \
            -E '(_tbb_scaling|_openmp_scaling)$'

      - name: Save кэш зависимостей (если был cache miss)
        if: always() && steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BMM_DEPS_PREFIX }}
          key: bmm-deps-${{ runner.os }}-${{ hashFiles('scripts/install-deps.sh') }}

      - name: Save кэш EPFL-датасета (если был cache miss)
        if: always() && steps.cache-epfl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: benchmarks/data/epfl
          key: bmm-epfl-dataset-v1
